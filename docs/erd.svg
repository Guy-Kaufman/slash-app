<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="Inter, Hanken Grotesk, Arial, sans-serif">
  <rect width="860" height="560" fill="#0B1020"/>
  <text x="28" y="40" fill="#E7E9F5" font-size="22" font-weight="700">Slash — Data Model</text>
  <text x="28" y="62" fill="#8A90B5" font-size="13">Supabase / PostgreSQL · Row Level Security: auth.uid() = user_id</text>

  <!-- auth.users -->
  <g>
    <rect x="40" y="110" width="240" height="118" rx="10" fill="#141A33" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="40" y="110" width="240" height="30" rx="10" fill="#1E2647"/>
    <text x="56" y="130" fill="#9DC0FF" font-size="14" font-weight="700">auth.users</text>
    <text x="56" y="160" fill="#E7E9F5" font-size="12.5">id            uuid  PK</text>
    <text x="56" y="182" fill="#C7CBE6" font-size="12.5">email         text</text>
    <text x="56" y="204" fill="#C7CBE6" font-size="12.5">raw_user_meta_data  jsonb</text>
  </g>

  <!-- subscriptions -->
  <g>
    <rect x="520" y="80" width="300" height="340" rx="10" fill="#141A33" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="520" y="80" width="300" height="30" rx="10" fill="#2A1E47"/>
    <text x="536" y="100" fill="#D7B8FF" font-size="14" font-weight="700">public.subscriptions</text>
    <text x="536" y="130" fill="#E7E9F5" font-size="12.5">id              text  PK</text>
    <text x="536" y="150" fill="#FFD9A0" font-size="12.5">user_id         uuid  FK → users.id</text>
    <text x="536" y="170" fill="#C7CBE6" font-size="12.5">slug            text</text>
    <text x="536" y="190" fill="#C7CBE6" font-size="12.5">name            text</text>
    <text x="536" y="210" fill="#C7CBE6" font-size="12.5">plan / category text</text>
    <text x="536" y="230" fill="#C7CBE6" font-size="12.5">amount          numeric</text>
    <text x="536" y="250" fill="#C7CBE6" font-size="12.5">billing_cycle   text</text>
    <text x="536" y="270" fill="#C7CBE6" font-size="12.5">status          text</text>
    <text x="536" y="290" fill="#C7CBE6" font-size="12.5">flagged         boolean</text>
    <text x="536" y="310" fill="#C7CBE6" font-size="12.5">last_charge_date  date</text>
    <text x="536" y="330" fill="#C7CBE6" font-size="12.5">next_billing    text</text>
    <text x="536" y="350" fill="#C7CBE6" font-size="12.5">total_paid / yearly_cost  numeric</text>
    <text x="536" y="370" fill="#C7CBE6" font-size="12.5">warning_label   text</text>
    <text x="536" y="390" fill="#C7CBE6" font-size="12.5">recommendation  text</text>
    <text x="536" y="410" fill="#C7CBE6" font-size="12.5">created_at      timestamptz</text>
  </g>

  <!-- cancellations -->
  <g>
    <rect x="120" y="350" width="300" height="178" rx="10" fill="#141A33" stroke="#22C55E" stroke-width="1.5"/>
    <rect x="120" y="350" width="300" height="30" rx="10" fill="#173524"/>
    <text x="136" y="370" fill="#9CF0BE" font-size="14" font-weight="700">public.cancellations</text>
    <text x="136" y="400" fill="#E7E9F5" font-size="12.5">id              uuid  PK</text>
    <text x="136" y="420" fill="#FFD9A0" font-size="12.5">subscription_id text  FK → subscriptions.id</text>
    <text x="136" y="440" fill="#FFD9A0" font-size="12.5">user_id         uuid  FK → users.id</text>
    <text x="136" y="460" fill="#C7CBE6" font-size="12.5">monthly_amount  numeric</text>
    <text x="136" y="480" fill="#C7CBE6" font-size="12.5">yearly_saving   numeric</text>
    <text x="136" y="500" fill="#C7CBE6" font-size="12.5">reason / letter_text  text</text>
  </g>

  <!-- relationships -->
  <!-- users -> subscriptions -->
  <path d="M280 150 C400 150, 430 150, 520 150" fill="none" stroke="#5B6488" stroke-width="1.5"/>
  <text x="360" y="142" fill="#8A90B5" font-size="11">1 ── ∞ owns</text>
  <!-- users -> cancellations -->
  <path d="M160 228 C160 290, 200 300, 230 350" fill="none" stroke="#5B6488" stroke-width="1.5"/>
  <text x="100" y="300" fill="#8A90B5" font-size="11">1 ── ∞ owns</text>
  <!-- subscriptions -> cancellations -->
  <path d="M520 360 C470 380, 450 410, 420 420" fill="none" stroke="#5B6488" stroke-width="1.5"/>
  <text x="430" y="400" fill="#8A90B5" font-size="11">1 ── ∞ cut as</text>
</svg>
